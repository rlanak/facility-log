[package]
name = "foxhole-save-parser"
version = "0.1.0"
edition = "2021"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
byteorder = "1"
thiserror = "1"
chrono = "0.4"

[lib]
name = "foxhole_save_parser"
path = "src/lib.rs"

[[bin]]
name = "foxhole-save-parser"
path = "src/main.rs"
