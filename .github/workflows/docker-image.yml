# Runs the tests (tests.yml) and, only if they pass, builds the web-mode Docker image and
# publishes it to GitHub Container Registry (ghcr.io/rlanak/facility-log) — only when a
# version tag (v1.2.3) is pushed. A tag whose tests fail publishes nothing: the image
# already published stays as it is.
# Pull requests, forks and branch pushes never run this.
name: Docker image

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

jobs:
  test:
    # The same job that runs on every push to main (tests.yml), here as the gate for publish.
    # Same condition as publish: in a fork there is nothing to gate.
    if: github.repository == 'rlanak/facility-log'
    uses: ./.github/workflows/tests.yml

  publish:
    # No image unless the tests passed.
    needs: test
    # Only the original repository publishes (a fork's copy of this workflow does nothing).
    if: github.repository == 'rlanak/facility-log'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
