# Web mode: `docker compose up -d --build` from this folder, with a filled-in
# .env next to this file (copy .env.example).
services:
  facility-log:
    build: .
    env_file: .env
    environment:
      FACILITY_LOG_DATA_DIR: /data
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./data-docker:/data
    restart: unless-stopped
