# Web mode: `docker compose up -d --build` from this folder, with a filled-in
# .env next to this file (copy .env.example). The sibling repo
# ../foxhole-msupps-parser must be checked out next to this one.
services:
  facility-log:
    build:
      context: ..
      dockerfile: facility-log/Dockerfile
    env_file: .env
    environment:
      FACILITY_LOG_DATA_DIR: /data
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./data-docker:/data
    restart: unless-stopped
