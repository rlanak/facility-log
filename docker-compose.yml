# Web mode with Docker. Fill in a .env next to this file (copy .env.example), then:
#
#   docker compose up -d          # uses the published image
#   docker compose pull && docker compose up -d   # update to the latest release
#
# To build from source instead: docker build -t ghcr.io/rlanak/facility-log:latest .
services:
  facility-log:
    image: ghcr.io/rlanak/facility-log:latest
    env_file: .env
    environment:
      FACILITY_LOG_DATA_DIR: /data
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./data-docker:/data
    restart: unless-stopped
    # Docker's default keeps the container log growing forever.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    # Hardening: no privilege gain inside the container, and only the
    # capabilities the entrypoint needs to hand /data to the app user and
    # drop to it (docker-entrypoint.sh).
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
